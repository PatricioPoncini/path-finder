[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "path-finder"
version = "0.1.0"
description = "Buscador de empleos que reúne ofertas de fuentes públicas y las ordena según tu CV, con reglas locales (sin IA)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
path-finder = "path_finder.cli:main"

[tool.setuptools.packages.find]
include = ["path_finder*"]

[tool.setuptools.package-data]
"path_finder.areas" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
